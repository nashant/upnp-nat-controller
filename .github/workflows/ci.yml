name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  KUBECONFORM_VERSION: v0.8.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@${{ env.KUBECONFORM_VERSION }}
      - name: Cache envtest binaries
        uses: actions/cache@v6
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Test
        run: make test
      - name: Coverage
        run: go tool cover -func=cover.out | tail -1

  # Images are published only after tests pass, and never from pull requests.
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: nashant/upnp-nat-controller
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
          flavor: |
            latest=false
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
