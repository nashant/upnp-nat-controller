image:
  repository: ghcr.io/nashant/upnp-nat-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

controller:
  # Root device description URL of the router. Empty: discover with SSDP.
  igdURL: ""
  resyncInterval: 30s
  # Default port mapping lease in seconds; 0 asks the router for a permanent mapping.
  leaseDuration: 3600
  soapTimeout: 5s
  finalizerTimeout: 10m
  # Prefix of the router-side mapping descriptions. Keep it short: the
  # router stores at most 63 bytes (longer names are shortened with a hash).
  descriptionPrefix: unc/
  # Router requests per second, and burst.
  rateLimit: 5
  rateBurst: 10
  # Service types to map. LoadBalancer forwards to the ingress IP; ClusterIP
  # forwards to the cluster IP, so the router needs a route to the Service CIDR.
  serviceTypes:
    - LoadBalancer
  leaderElect: true
  logLevel: info
  extraArgs: []

# The pod uses the node's network (SSDP multicast), so these ports are
# opened on the node.
ports:
  metrics: 8080
  health: 8081

metrics:
  service:
    enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
