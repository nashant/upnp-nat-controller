apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upnp-nat-controller.fullname" . }}
  labels:
    {{- include "upnp-nat-controller.labels" . | nindent 4 }}
spec:
  replicas: 1
  # hostNetwork makes the ports hostPorts, so old and new pods cannot overlap on a node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "upnp-nat-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "upnp-nat-controller.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "upnp-nat-controller.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # SSDP discovery needs the node's LAN interface.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.controller.leaderElect }}
            - --resync-interval={{ .Values.controller.resyncInterval }}
            - --lease-duration={{ .Values.controller.leaseDuration | int64 }}
            - --soap-timeout={{ .Values.controller.soapTimeout }}
            - --finalizer-timeout={{ .Values.controller.finalizerTimeout }}
            - --description-prefix={{ .Values.controller.descriptionPrefix }}
            - --rate-limit={{ .Values.controller.rateLimit }}
            - --rate-burst={{ .Values.controller.rateBurst }}
            - --metrics-bind-address=:{{ .Values.ports.metrics }}
            - --health-probe-bind-address=:{{ .Values.ports.health }}
            - --zap-log-level={{ .Values.controller.logLevel }}
            {{- with .Values.controller.igdURL }}
            - --igd-url={{ . }}
            {{- end }}
            {{- range .Values.controller.extraArgs }}
            - {{ . }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.ports.health }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
