{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "upnp-nat-controller.rbacName" . }}
  labels:
    {{- include "upnp-nat-controller.labels" . | nindent 4 }}
  {{- with .Values.rbac.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["services/finalizers"]
  verbs: ["update"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["gateway.nashes.uk"]
  resources: ["internetgatewaydevices"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["gateway.nashes.uk"]
  resources: ["internetgatewaydevices/status"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "upnp-nat-controller.rbacName" . }}
  labels:
    {{- include "upnp-nat-controller.labels" . | nindent 4 }}
  {{- with .Values.rbac.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "upnp-nat-controller.rbacName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "upnp-nat-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "upnp-nat-controller.rbacName" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upnp-nat-controller.labels" . | nindent 4 }}
  {{- with .Values.rbac.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "upnp-nat-controller.rbacName" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upnp-nat-controller.labels" . | nindent 4 }}
  {{- with .Values.rbac.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "upnp-nat-controller.rbacName" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "upnp-nat-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
